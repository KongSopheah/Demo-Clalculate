<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dice Roller</title>
    <style>
      #container {
        font-family: sans-serif;
        text-align: center;
      }
      input {
        width: 150px;
        padding: 10px;
        border-radius: 5px;
        text-align: center;
        font-size: 20px;
      }
      button {
        padding: 10px 20px;
        border-radius: 5px;
        background-color: hsl(240, 80%, 50%);
        color: white;
        font-size: 20px;
        font-weight: 500;
      }
      #diceResult {
        margin-top: 10px;
        font-size: 20px;
      }
    </style>
  </head>
  <body>
    <div id="container">
      <h1>Dice Roller</h1>
      <label># of dice</label>
      <input type="number" id="dice-number" value="1" min="1" />
      <button onclick="rollDice()">Roll Dice</button>
      <div id="diceResult"></div>
      <div id="diceImage"></div>
    </div>
  </body>
  <script src="dice.js"></script>
</html>
